# Render blueprint (untested against a live Render account - see docs/README).
services:
  - type: web
    name: sports-ai-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGINS
        sync: false        # set to your Vercel URL, e.g. https://sports-ai.vercel.app
      - key: DATABASE_URL
        fromDatabase: { name: sports-ai-db, property: connectionString }
databases:
  - name: sports-ai-db
    plan: free
